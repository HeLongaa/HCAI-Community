      CREATIVE_OUTPUT_SAFETY_CLASSIFIER_TOKEN: ${{ secrets.CREATIVE_OUTPUT_SAFETY_CLASSIFIER_TOKEN }}
      CREATIVE_STAGING_SMOKE_MODE: ${{ vars.CREATIVE_STAGING_SMOKE_MODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix server ci

      - name: Run real environment smoke
        if: inputs.smoke_profile == 'env'
        run: npm run smoke:production:env

      - name: Run creative staging smoke
        if: inputs.smoke_profile == 'creative-staging'
        run: npm run smoke:creative-staging:env

  infrastructure-rehearsal:
    name: Isolated Infrastructure Rehearsal
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_profile == 'infrastructure-rehearsal'
    environment: ${{ inputs.environment }}
    env:
      RELEASE_REHEARSAL_CONFIRMATION: ${{ secrets.RELEASE_REHEARSAL_CONFIRMATION }}
      RELEASE_REHEARSAL_SOURCE_SHA: ${{ github.sha }}
      RELEASE_REHEARSAL_SSH_HOST: ${{ secrets.RELEASE_REHEARSAL_SSH_HOST }}
      RELEASE_REHEARSAL_SSH_PORT: ${{ secrets.RELEASE_REHEARSAL_SSH_PORT }}
      RELEASE_REHEARSAL_SSH_USER: ${{ secrets.RELEASE_REHEARSAL_SSH_USER }}
      RELEASE_REHEARSAL_SSH_INFRASTRUCTURE_COMMAND: ${{ secrets.RELEASE_REHEARSAL_SSH_INFRASTRUCTURE_COMMAND }}
      RELEASE_REHEARSAL_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_REHEARSAL_SSH_PRIVATE_KEY }}
      RELEASE_REHEARSAL_SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_REHEARSAL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verify isolated rehearsal configuration
        run: npm run release:infrastructure:preflight

      - name: Execute isolated PostgreSQL, Redis, and S3 rehearsal
        run: npm run release:infrastructure:rehearse:env

      - name: Upload sanitized rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-infrastructure-rehearsal
          path: .artifacts/release-infrastructure/latest.json
          if-no-files-found: error
          retention-days: 30

  application-rehearsal:
    name: Staging Application Release Rehearsal
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_profile == 'application-rehearsal'
    environment: ${{ inputs.environment }}
    env:
      RELEASE_APPLICATION_REHEARSAL_CONFIRMATION: ${{ secrets.RELEASE_APPLICATION_REHEARSAL_CONFIRMATION }}
      RELEASE_REHEARSAL_TARGET_ORIGIN: ${{ secrets.RELEASE_REHEARSAL_TARGET_ORIGIN }}
      RELEASE_CANDIDATE_ARTIFACT_SHA256: ${{ secrets.RELEASE_CANDIDATE_ARTIFACT_SHA256 }}
      RELEASE_PREVIOUS_ARTIFACT_SHA256: ${{ secrets.RELEASE_PREVIOUS_ARTIFACT_SHA256 }}
      RELEASE_REHEARSAL_DEPLOY_COMMAND_JSON: ${{ secrets.RELEASE_REHEARSAL_DEPLOY_COMMAND_JSON }}
      RELEASE_REHEARSAL_ROLLBACK_COMMAND_JSON: ${{ secrets.RELEASE_REHEARSAL_ROLLBACK_COMMAND_JSON }}
      RELEASE_REHEARSAL_SSH_HOST: ${{ secrets.RELEASE_REHEARSAL_SSH_HOST }}
      RELEASE_REHEARSAL_SSH_PORT: ${{ secrets.RELEASE_REHEARSAL_SSH_PORT }}
      RELEASE_REHEARSAL_SSH_USER: ${{ secrets.RELEASE_REHEARSAL_SSH_USER }}
      RELEASE_REHEARSAL_SSH_DEPLOY_COMMAND: ${{ secrets.RELEASE_REHEARSAL_SSH_DEPLOY_COMMAND }}
      RELEASE_REHEARSAL_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_REHEARSAL_SSH_PRIVATE_KEY }}
      RELEASE_REHEARSAL_SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_REHEARSAL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Verify application release rehearsal configuration
        run: npm run release:application:preflight

      - name: Deploy candidate, smoke, rollback, and smoke previous release
        run: npm run release:application:rehearse:env

      - name: Upload sanitized application release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-application-rehearsal
          path: .artifacts/release-application/latest.json
          if-no-files-found: error
          retention-days: 30
