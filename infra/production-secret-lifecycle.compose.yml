services:
  vault-agent:
    image: hashicorp/vault@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    restart: unless-stopped
    command: ["agent", "-config=/etc/vault-agent/config.hcl"]
    environment:
      VAULT_ADDR: ${SECRET_LIFECYCLE_VAULT_ADDR:?SECRET_LIFECYCLE_VAULT_ADDR is required}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./production/vault-agent.hcl:/etc/vault-agent/config.hcl:ro
      - ${SECRET_LIFECYCLE_PRODUCTION_ROOT:?SECRET_LIFECYCLE_PRODUCTION_ROOT is required}/workload:/run/vault-workload:ro
      - vault-agent-token:/run/vault-agent
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/vault-agent/token && VAULT_TOKEN=$$(cat /run/vault-agent/token) vault token lookup -address=$$VAULT_ADDR -ca-cert=/run/vault-workload/ca.crt >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 128
    cpus: 0.50
    mem_limit: 192m
    networks:
      - secret-manager-egress

  secret-lifecycle-gateway:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "src/modelControl/secretLifecycleGatewayServer.js"]
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      NODE_EXTRA_CA_CERTS: /run/secret-lifecycle-trust/ca-bundle.crt
      SECRET_LIFECYCLE_MANAGED_VAULT_CONFIRMATION: ha-auto-unseal-backed-vault
      SECRET_LIFECYCLE_GATEWAY_HOST: 0.0.0.0
      SECRET_LIFECYCLE_GATEWAY_PORT: 8790
      SECRET_LIFECYCLE_GATEWAY_TLS_CERT_FILE: /run/secret-lifecycle-server/server.crt
      SECRET_LIFECYCLE_GATEWAY_TLS_KEY_FILE: /run/secret-lifecycle-server/server.key
      SECRET_LIFECYCLE_GATEWAY_BEARER_TOKEN_FILE: /run/secret-lifecycle-client/gateway-token
      SECRET_LIFECYCLE_VAULT_ADDR: ${SECRET_LIFECYCLE_VAULT_ADDR:?SECRET_LIFECYCLE_VAULT_ADDR is required}
      SECRET_LIFECYCLE_VAULT_KV_MOUNT: ${SECRET_LIFECYCLE_VAULT_KV_MOUNT:-provider-secrets}
      SECRET_LIFECYCLE_VAULT_PATH_PREFIX: ${SECRET_LIFECYCLE_VAULT_PATH_PREFIX:-hcai/production/providers}
      SECRET_LIFECYCLE_SECRET_REF_PREFIX: ${SECRET_LIFECYCLE_SECRET_REF_PREFIX:-secret://vault/providers/}
      SECRET_LIFECYCLE_VAULT_TOKEN_FILE: /run/vault-agent/token
    volumes:
      - ${SECRET_LIFECYCLE_PRODUCTION_ROOT:?SECRET_LIFECYCLE_PRODUCTION_ROOT is required}/client:/run/secret-lifecycle-client:ro
      - ${SECRET_LIFECYCLE_PRODUCTION_ROOT:?SECRET_LIFECYCLE_PRODUCTION_ROOT is required}/gateway:/run/secret-lifecycle-server:ro
      - ${SECRET_LIFECYCLE_PRODUCTION_ROOT:?SECRET_LIFECYCLE_PRODUCTION_ROOT is required}/trust:/run/secret-lifecycle-trust:ro
      - vault-agent-token:/run/vault-agent:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:8790/readyz').then(r=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      vault-agent:
        condition: service_healthy
    pids_limit: 128
    cpus: 0.50
    mem_limit: 192m
    networks:
      - backend
      - secret-manager-egress

  worker:
    environment:
      NODE_EXTRA_CA_CERTS: /run/secret-lifecycle-trust/ca-bundle.crt
      PROVIDER_SECRET_RETENTION_WORKER_ENABLED: "true"
      SECRET_MANAGER_LIFECYCLE_GATEWAY_ENABLED: "true"
      SECRET_MANAGER_LIFECYCLE_GATEWAY_CONFIRMATION: managed-secret-lifecycle-enabled
      SECRET_MANAGER_LIFECYCLE_GATEWAY_URL: https://secret-lifecycle-gateway:8790/v1/lifecycle
      SECRET_MANAGER_LIFECYCLE_GATEWAY_TOKEN_FILE: /run/secret-lifecycle-client/gateway-token
      SECRET_LIFECYCLE_SECRET_REF_PREFIX: ${SECRET_LIFECYCLE_SECRET_REF_PREFIX:-secret://vault/providers/}
    volumes:
      - ${SECRET_LIFECYCLE_PRODUCTION_ROOT:?SECRET_LIFECYCLE_PRODUCTION_ROOT is required}/client:/run/secret-lifecycle-client:ro
      - ${SECRET_LIFECYCLE_PRODUCTION_ROOT:?SECRET_LIFECYCLE_PRODUCTION_ROOT is required}/trust:/run/secret-lifecycle-trust:ro
    depends_on:
      secret-lifecycle-gateway:
        condition: service_healthy

networks:
  secret-manager-egress: {}

volumes:
  vault-agent-token:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=0770,uid=100,gid=1000
