services:
  vault:
    image: hashicorp/vault@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    restart: unless-stopped
    command: ["server"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/vault.hcl:/vault/config/vault.hcl:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/ca.crt:/vault/tls/ca.crt:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/vault.crt:/vault/tls/vault.crt:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/vault.key:/vault/tls/vault.key:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=https://127.0.0.1:8200", "-ca-cert=/vault/tls/ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 256
    cpus: 1.00
    mem_limit: 512m
    networks:
      - backend

  secret-lifecycle-gateway:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "src/modelControl/secretLifecycleGatewayServer.js"]
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /run/secret-lifecycle-ca/ca.crt
      SECRET_LIFECYCLE_GATEWAY_HOST: 0.0.0.0
      SECRET_LIFECYCLE_GATEWAY_PORT: 8790
      SECRET_LIFECYCLE_GATEWAY_TLS_CERT_FILE: /run/secret-lifecycle-tls/gateway.crt
      SECRET_LIFECYCLE_GATEWAY_TLS_KEY_FILE: /run/secret-lifecycle-tls/gateway.key
      SECRET_LIFECYCLE_GATEWAY_BEARER_TOKEN_FILE: /run/secret-lifecycle-secrets/gateway-token
      SECRET_LIFECYCLE_VAULT_ADDR: https://vault:8200/
      SECRET_LIFECYCLE_VAULT_KV_MOUNT: provider-secrets
      SECRET_LIFECYCLE_VAULT_PATH_PREFIX: hcai/staging/providers
      SECRET_LIFECYCLE_SECRET_REF_PREFIX: secret://vault/providers/
      SECRET_LIFECYCLE_VAULT_TOKEN_FILE: /run/secret-lifecycle-secrets/vault-gateway-token
    volumes:
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/secrets/gateway-token:/run/secret-lifecycle-secrets/gateway-token:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/secrets/vault-gateway-token:/run/secret-lifecycle-secrets/vault-gateway-token:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/ca.crt:/run/secret-lifecycle-ca/ca.crt:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/gateway.crt:/run/secret-lifecycle-tls/gateway.crt:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/gateway.key:/run/secret-lifecycle-tls/gateway.key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://127.0.0.1:8790/healthz').then(r=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      vault:
        condition: service_healthy
    pids_limit: 128
    cpus: 0.50
    mem_limit: 192m
    networks:
      - backend

  worker:
    environment:
      NODE_EXTRA_CA_CERTS: /run/secret-lifecycle-ca/ca.crt
      PROVIDER_SECRET_RETENTION_WORKER_ENABLED: "true"
      SECRET_MANAGER_LIFECYCLE_GATEWAY_ENABLED: "true"
      SECRET_MANAGER_LIFECYCLE_GATEWAY_CONFIRMATION: managed-secret-lifecycle-enabled
      SECRET_MANAGER_LIFECYCLE_GATEWAY_URL: https://secret-lifecycle-gateway:8790/v1/lifecycle
      SECRET_MANAGER_LIFECYCLE_GATEWAY_TOKEN_FILE: /run/secret-lifecycle-secrets/gateway-token
      SECRET_LIFECYCLE_SECRET_REF_PREFIX: secret://vault/providers/
    volumes:
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/secrets/gateway-token:/run/secret-lifecycle-secrets/gateway-token:ro
      - ${SECRET_LIFECYCLE_HOST_ROOT:-/opt/newchat-staging/secret-lifecycle}/tls/ca.crt:/run/secret-lifecycle-ca/ca.crt:ro
    depends_on:
      secret-lifecycle-gateway:
        condition: service_healthy
